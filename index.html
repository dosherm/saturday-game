<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saturday Game — Youche CC</title>
<style>
/* ── Tokens ─────────────────────────────────────────────────────────────── */
:root {
  --ground:      #F4F6F1;
  --surface:     #FFFFFF;
  --row-alt:     #EBF0E6;
  --border:      #C8D4BE;
  --text:        #192318;
  --text-2:      #4A5E44;
  --accent:      #1E5C1E;
  --accent-lt:   #1E5C1E;
  --conf-bg:     #EAF4EA;
  --conf-txt:    #1A6B1A;
  --pend-bg:     #FFF8E6;
  --pend-txt:    #7A5800;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground:    #111A11;
    --surface:   #182118;
    --row-alt:   #1E2A1E;
    --border:    #2E3E2E;
    --text:      #DDE8D5;
    --text-2:    #849C7A;
    --accent:    #5DA85D;
    --accent-lt: #74C074;
    --conf-bg:   #152515;
    --conf-txt:  #6DCF6D;
    --pend-bg:   #2A2210;
    --pend-txt:  #D4AA40;
  }
}
:root[data-theme="light"] {
  --ground:    #F4F6F1; --surface: #FFFFFF; --row-alt: #EBF0E6;
  --border:    #C8D4BE; --text: #192318; --text-2: #4A5E44;
  --accent:    #1E5C1E; --accent-lt: #1E5C1E;
  --conf-bg:   #EAF4EA; --conf-txt: #1A6B1A;
  --pend-bg:   #FFF8E6; --pend-txt: #7A5800;
}
:root[data-theme="dark"] {
  --ground:    #111A11; --surface: #182118; --row-alt: #1E2A1E;
  --border:    #2E3E2E; --text: #DDE8D5; --text-2: #849C7A;
  --accent:    #5DA85D; --accent-lt: #74C074;
  --conf-bg:   #152515; --conf-txt: #6DCF6D;
  --pend-bg:   #2A2210; --pend-txt: #D4AA40;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--ground);
  color: var(--text);
  font-family: 'Helvetica Neue', Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
  padding: 0 0 3rem;
}

/* ── Header ─────────────────────────────────────────────────────────────── */
.page-header {
  background: var(--accent);
  color: #fff;
  padding: 2rem 2rem 1.75rem;
}
.header-eyebrow {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  opacity: 0.75;
  margin-bottom: 0.25rem;
}
.header-title {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: clamp(1.6rem, 4vw, 2.4rem);
  font-weight: normal;
  line-height: 1.1;
  text-wrap: balance;
}
.header-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 0 1.25rem;
  margin-top: 0.75rem;
  font-size: 13px;
  opacity: 0.85;
}

/* ── Controls ───────────────────────────────────────────────────────────── */
.controls {
  padding: 1rem 2rem 0.5rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
}
.sort-label {
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-2);
}
.sort-btns { display: flex; gap: 0.5rem; }
.sort-btn {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text-2);
  cursor: pointer;
  font-size: 12px;
  letter-spacing: 0.04em;
  padding: 0.3em 0.8em;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
}
.sort-btn:hover, .sort-btn:focus-visible {
  background: var(--row-alt);
  color: var(--text);
  outline: none;
}
.sort-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.summary {
  margin-left: auto;
  font-size: 12px;
  color: var(--text-2);
  display: flex;
  gap: 0.75rem;
}
.summary-conf  { color: var(--conf-txt); font-weight: 600; }
.summary-pend  { color: var(--pend-txt); font-weight: 600; }

/* ── Table ──────────────────────────────────────────────────────────────── */
.table-wrap { padding: 0.5rem 2rem 0; overflow-x: auto; }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}
thead th {
  background: var(--surface);
  border-bottom: 2px solid var(--accent);
  color: var(--text-2);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  padding: 0.65rem 1rem;
  text-align: left;
  text-transform: uppercase;
  white-space: nowrap;
}
thead th.num { text-align: right; }
thead th.center { text-align: center; }

tbody tr { border-bottom: 1px solid var(--border); }
tbody tr:nth-child(even) { background: var(--row-alt); }
tbody tr:hover { background: color-mix(in srgb, var(--accent) 8%, var(--ground)); }

tbody td { padding: 0.7rem 1rem; vertical-align: middle; }
td.num    { text-align: right; }
td.center { text-align: center; }

.rank         { color: var(--text-2); font-size: 12px; width: 2.5rem; }
.player-name  { font-size: 15px; font-weight: 500; }
.ghin-num     { color: var(--text-2); font-size: 12px; }
.hi-value     { font-weight: 600; }
.ch-value     { font-weight: 700; font-size: 16px; color: var(--accent-lt); }

/* ── Confirmed pill ─────────────────────────────────────────────────────── */
.pill {
  border-radius: 20px;
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.05em;
  padding: 0.2em 0.7em;
  text-transform: uppercase;
}
.pill-yes {
  background: var(--conf-bg);
  color: var(--conf-txt);
}
.pill-no {
  background: var(--pend-bg);
  color: var(--pend-txt);
}

/* ── Footer ─────────────────────────────────────────────────────────────── */
.footer {
  margin-top: 2rem;
  padding: 1rem 2rem 0;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-2);
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem 2rem;
}

@media (max-width: 640px) {
  .page-header, .controls, .table-wrap, .footer { padding-left: 1rem; padding-right: 1rem; }
  .ghin-col { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="page-header">
  <p class="header-eyebrow">Youche Country Club &nbsp;·&nbsp; White Tees</p>
  <h1 class="header-title">Saturday Game</h1>
  <div class="header-meta">
    <span>July 26, 2026</span>
    <span>&nbsp;|&nbsp; Rating 70.4</span>
    <span>&nbsp;|&nbsp; Slope 127</span>
    <span>&nbsp;|&nbsp; Par 71</span>
  </div>
</header>

<div class="controls">
  <span class="sort-label">Sort by</span>
  <div class="sort-btns">
    <button class="sort-btn active" onclick="sortTable('hcp', this)">Handicap</button>
    <button class="sort-btn" onclick="sortTable('name', this)">Name</button>
    <button class="sort-btn" onclick="sortTable('confirmed', this)">Confirmed</button>
  </div>
  <div class="summary" id="summary"></div>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th style="width:2.5rem">#</th>
        <th>Player</th>
        <th class="ghin-col">GHIN</th>
        <th class="num">HI</th>
        <th class="num">Course HC</th>
        <th class="center">Confirmed</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<footer class="footer">
  <span>Course HC = round(HI &times; 127&frasl;113 + (70.4 &minus; 71))</span>
  <span>Source: GHIN API &nbsp;&middot;&nbsp; Fetched July 24, 2026</span>
</footer>

<script>
const PLAYERS = [
  { name: "Matt Ruess",      ghin: "10189718", hi:  4.8, hcp:  5, confirmed: true  },
  { name: "Chris Blaylock",  ghin: "10189771", hi: 11.5, hcp: 12, confirmed: true  },
  { name: "Dan Sherman",     ghin: "10189450", hi:  8.1, hcp:  9, confirmed: true  },
  { name: "David Franklin",  ghin: "10189789", hi:  7.2, hcp:  7, confirmed: true  },
  { name: "Joel Hanger",     ghin: "10189630", hi:  1.8, hcp:  1, confirmed: true  },
  { name: "Mike Bauner",     ghin: "3193186",  hi:  4.3, hcp:  4, confirmed: true  },
  { name: "Kyle Bauner",     ghin: "12981287", hi: 11.0, hcp: 12, confirmed: true  },
  { name: "Hunter Smith",    ghin: "12270584", hi:  4.8, hcp:  5, confirmed: true  },
  { name: "Kevin Livesay",   ghin: "10288717", hi:  9.8, hcp: 10, confirmed: true  },
  { name: "Kevin Babcock",   ghin: "10189777", hi:  5.3, hcp:  5, confirmed: false },
  { name: "Scott Yoder",     ghin: "11135860", hi: 12.4, hcp: 13, confirmed: true  },
  { name: "Parke Callham",   ghin: "11837227", hi:  5.6, hcp:  6, confirmed: true  },
  { name: "Robert Scott Jr", ghin: "10189703", hi: 20.9, hcp: 23, confirmed: true  },
  { name: "Sean Granger",    ghin: "10193174", hi: 17.8, hcp: 19, confirmed: true  },
  { name: "Matt Bruder",     ghin: "10640059", hi: 13.9, hcp: 15, confirmed: true  },
  { name: "Matt Mosak",      ghin: "11254357", hi:  9.9, hcp: 11, confirmed: true  },
];

let currentSort = 'hcp';

function sortTable(by, btn) {
  currentSort = by;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render() {
  const sorted = [...PLAYERS].sort((a, b) => {
    if (currentSort === 'hcp')       return a.hcp - b.hcp;
    if (currentSort === 'name')      return a.name.localeCompare(b.name);
    if (currentSort === 'confirmed') return (b.confirmed ? 1 : 0) - (a.confirmed ? 1 : 0);
    return 0;
  });

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  sorted.forEach((p, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="rank">${i + 1}</td>
      <td class="player-name">${p.name}</td>
      <td class="ghin-col ghin-num">${p.ghin}</td>
      <td class="num hi-value">${p.hi.toFixed(1)}</td>
      <td class="num ch-value">${p.hcp}</td>
      <td class="center"><span class="pill ${p.confirmed ? 'pill-yes' : 'pill-no'}">${p.confirmed ? 'Yes' : 'Pending'}</span></td>
    `;
    tbody.appendChild(tr);
  });

  const confirmed = PLAYERS.filter(p => p.confirmed).length;
  const pending   = PLAYERS.length - confirmed;
  document.getElementById('summary').innerHTML =
    `<span class="summary-conf">${confirmed} confirmed</span>
     <span class="summary-pend">${pending} pending</span>`;
}

render();
</script>
</body>
</html>
